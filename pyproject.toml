[project]
name = "kessler-syndrome-simulation-orbital-cascade-collisions"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pytest>=9.2.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "sgp4>=2.27",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["kessler_sim", "collision_physics"]
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
